name = "discord-issue-bot"
main = "src/index.ts"
compatibility_date = "2024-10-19"
compatibility_flags = ["nodejs_compat"]

[vars]
DISCORD_APPLICATION_ID = "815097353228910643"
DISCORD_PUBLIC_KEY = "ae50150a5c0e8cda2cfdd980e329685560a89eb8f863ebf106ca786943c51ce4"
GITHUB_CLIENT_ID = "Iv23lip7ojqobhLDXY37"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "KV"
id = "edc38ab2d02f4e2e9ed565f051cf2b52"

[[d1_databases]]
binding = "DB"
database_name = "discord-issue-bot"
database_id = "058e4e61-30a7-4ee4-b2b3-cc96920031ea"
migrations_dir = "migrations"

# cron は UTC で指定する。JST の毎日 3:00
[triggers]
crons = ["0 18 * * *"]
